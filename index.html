<!DOCTYPE html>
<html lang="en">

<head>
    <title>Grammar Exercise</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/favicon.png" type="image/x-icon">
    <!--fonts-->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header> </header>
    <main>
        <div class="head"></div>
        <div class="instrucciones">A customer wants to make a credit card payment over the phone.</div>
        <div class="mesa">
            <div class="popup">blank for nowkjfdkjsadfjlsdfkj</div>
            <form action="#" method="POST">
                <div class="option-style">
                    <input type="radio" id="opcion-uno" name="opciones" required>
                    <label for="opcion-uno">Okay, tell me your card numbers.</label>

                </div>
                <div class="option-style">
                    <input type="radio" id="opcion-dos" name="opciones" required>
                    <label for="opcion-dos">I can take that. What's your card info?</label>

                </div>
                <div class="option-style">
                    <input type="radio" id="opcion-tres" name="opciones" required>
                    <label for="opcion-tres">Certainly, I can assist with that securely. Please provide your card
                        number,
                        expiry date, and CVV code.</label>

                </div>
                <div class="option-style">
                    <input type="radio" id="opcion-cuatro" name="opciones" required>
                    <label for="opcion-cuatro">The weather is nice today, isn't it?</label>

                </div>
            </form>
        </div>
        <div id="continuar" class="contenedor-continuar"><a href="#">Continue</a></div>
    </main>
    <footer></footer>
    <script src="script.js"></script>
</body>

</html>
